# Автосборка: при создании тега v0.4.1 (и т.п.) GitHub сам соберёт установщик,
# подпишет его и выложит релиз вместе с latest.json для автообновления.
name: release
on:
  push:
    tags: ['v*']
jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Сжимаем и запутываем код интерфейса: внутри установщика он нечитаем
      - name: Minify UI
        shell: bash
        run: |
          cd ui
          for f in app.js extras.js i18n.js; do
            npx --yes terser@5 "$f" --compress passes=2 --mangle -o "$f.min" && mv "$f.min" "$f"
          done
          npx --yes csso-cli@4 style.css -o style.min.css && mv style.min.css style.css
          npx --yes html-minifier-terser@7 index.html --collapse-whitespace --remove-comments -o index.min.html && mv index.min.html index.html
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'MineLauncher ${{ github.ref_name }}'
          releaseBody: 'Новая версия лаунчера. Он предложит обновиться сам.'
          releaseDraft: false
          prerelease: false
